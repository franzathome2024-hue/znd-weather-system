name = "znd-weather-system"
main = "src/worker/index.js"
compatibility_date = "2025-03-04"
compatibility_flags = ["nodejs_compat"]

# ---------- Static frontend (served by the Worker) ----------
[assets]
directory = "./public"
binding = "ASSETS"
# Fail open on missing asset so our Worker still runs for API routes
not_found_handling = "single-page-application"

# ---------- KV namespaces --------
# IMPORTANT: Production KV namespace IDs are NOT hardcoded here. They must be
# provisioned and bound explicitly via `wrangler kv namespace create` per environment.
#
# The worker operates in "in-memory only" mode if FORECAST_CACHE is unbound (useful for
# local dev / wrangler dev before you run `wrangler kv namespace create`). In that
# mode, the /api/healthz endpoint reports persistentCache: "disabled".
#
# To enable durable per-locality last-known-good caching:
#   1. Create dev KV namespace:
#        wrangler kv namespace create FORECAST_CACHE --env dev
#   2. Create production KV namespace (requires authorization — do NOT run without owner approval):
#        wrangler kv namespace create FORECAST_CACHE
#   3. Paste the returned {id, preview_id} into the [[kv_namespaces]] blocks below.
#
# [[kv_namespaces]]                # production
# binding = "FORECAST_CACHE"
# id      = "REPLACE_WITH_PROD_KV_ID"  # provision after authorization
#
# [[kv_namespaces]]                # development (bound under [env.dev])
# binding = "FORECAST_CACHE"
# id      = "REPLACE_WITH_DEV_KV_ID"
# preview_id = "REPLACE_WITH_DEV_PREVIEW_ID"

# ---------- Scheduled trigger: hourly checks (UTC; Asia/Manila = UTC+8) ----------
[triggers]
crons = ["0 * * * *"]

# ---------- Environment variables (non-secret) ----------
[vars]
ENVIRONMENT = "production"
OPEN_METEO_BASE_URL = "https://api.open-meteo.com/v1/forecast"
FORECAST_DAYS = "7"
FACEBOOK_PUBLISH_ENABLED = "false"   # OFF by default; never publish automatically
STALE_AFTER_HOURS = "8"
MAX_RETRIES_PER_REQUEST = "2"
REQUEST_TIMEOUT_MS = "15000"

# ---------- Bindings for secrets (set via `wrangler secret put NAME`) ----------
# Required: none for v0.1 (Open-Meteo is keyless at non-commercial volumes).
# Optional (when Facebook publishing is explicitly enabled):
#   FACEBOOK_PAGE_ACCESS_TOKEN
#   FACEBOOK_PAGE_ID
# Admin-only:
#   ADMIN_SECRET — required for POST /api/scheduler/run (set in production; use long random value)

# ---------- Preview / dev environment ----------
[env.dev]
name = "znd-weather-system-dev"
[env.dev.vars]
ENVIRONMENT = "development"
FORECAST_DAYS = "3"
FACEBOOK_PUBLISH_ENABLED = "false"
STALE_AFTER_HOURS = "8"
MAX_RETRIES_PER_REQUEST = "2"
REQUEST_TIMEOUT_MS = "15000"
